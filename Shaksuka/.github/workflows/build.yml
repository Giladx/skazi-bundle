name: Build SHAKSUKA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: SHAKSUKA-${{ matrix.name }}
          path: |
            build/Shaksuka_artefacts/Release/VST3
            build/Shaksuka_artefacts/Release/AU
            build/Shaksuka_artefacts/Release/Standalone
