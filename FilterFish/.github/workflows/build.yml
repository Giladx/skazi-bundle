name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FilterFish-${{ matrix.name }}
          path: |
            build/FilterFish_artefacts/Release/VST3
            build/FilterFish_artefacts/Release/AU
            build/FilterFish_artefacts/Release/Standalone
