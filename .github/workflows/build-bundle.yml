name: Build SKAZI Bundle

# Builds every SKAZI plugin and both installers:
#   Mac:     SKAZI Bundle.pkg          (VST3 + AU + apps, Apple Silicon + Intel)
#   Windows: SKAZI Bundle Setup.exe    (VST3 + apps)
# Download them from the run's "Artifacts" section.
on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build plugins and SKAZI Bundle.pkg
        run: bash mac/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SKAZI-Bundle-Mac
          path: dist/SKAZI Bundle.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugins and SKAZI Bundle Setup.exe
        shell: pwsh
        run: ./build_bundle.ps1 -BuildRoot C:\skz
      - uses: actions/upload-artifact@v4
        with:
          name: SKAZI-Bundle-Windows
          path: dist/SKAZI Bundle Setup.exe
